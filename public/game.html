<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Disco Dog Dash</title>
  <style>
    :root {
      --sky-top: #ff9a56;
      --sky-bottom: #ffd56b;
      --ground: #3a2a1a;
      --ground-line: #5c4530;
      --ui-bg: rgba(0, 0, 0, 0.55);
      --accent: #ff5c8a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      font-family: 'Trebuchet MS', Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 900px;
      max-height: 600px;
      aspect-ratio: 3/2;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 65%);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 18px;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    #hud .box {
      background: var(--ui-bg);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 15px;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      padding: 20px;
    }

    #overlay h1 {
      font-size: clamp(24px, 6vw, 40px);
      margin: 0 0 6px 0;
      color: #ffe066;
    }

    #overlay p {
      margin: 4px 0;
      font-size: clamp(13px, 3vw, 16px);
    }

    #overlay button {
      margin-top: 18px;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 0 #b53a63;
      transition: transform 0.08s;
    }

    #overlay button:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #b53a63;
    }

    #hint {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-size: 12px;
      opacity: 0.85;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="box">🕺 Score: <span id="score">0</span></div>
      <div class="box">🏆 Best: <span id="best">0</span></div>
    </div>
    <div id="overlay">
      <h1>DISCO DOG DASH</h1>
      <p>Tap / Click / Press Space to jump.</p>
      <p>Dodge the obstacles and keep the dance going!</p>
      <button id="startBtn">Start Dancing</button>
    </div>
    <div id="hint">space / click / tap to jump &nbsp;•&nbsp; hold for higher jump</div>
  </div>

  <script>(function () {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const wrap = document.getElementById('wrap');
      const overlay = document.getElementById('overlay');
      const startBtn = document.getElementById('startBtn');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const hint = document.getElementById('hint');

      let W, H, DPR;
      function resize() {
        const rect = wrap.getBoundingClientRect();
        DPR = window.devicePixelRatio || 1;
        W = rect.width; H = rect.height;
        canvas.width = W * DPR;
        canvas.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      // Preload frames as Image objects
      const images = DOG_FRAMES.map(src => {
        const img = new Image();
        img.src = src;
        return img;
      });
      const FRAME_COUNT = images.length;

      // Game state
      let running = false;
      let gameOver = false;
      let score = 0;
      let best = parseInt(localStorage.getItem('discoDogBest') || '0', 10);
      bestEl.textContent = best;

      let groundY;
      let dog, obstacles, particles;
      let speed, spawnTimer, frameTimer, animFrame, elapsed;

      const GRAVITY = 0.0055;   // px per ms^2 equivalent (scaled)
      const JUMP_V = -1.55;
      const DOG_SIZE = 90;

      function resetGame() {
        groundY = H * 0.82;
        dog = {
          x: W * 0.18,
          y: groundY - DOG_SIZE,
          vy: 0,
          onGround: true,
          size: DOG_SIZE,
          squash: 1
        };
        obstacles = [];
        particles = [];
        speed = 0.32; // px per ms
        spawnTimer = 0;
        frameTimer = 0;
        animFrame = 0;
        elapsed = 0;
        score = 0;
        gameOver = false;
        scoreEl.textContent = '0';
      }

      function jump() {
        if (!running || gameOver) return;
        if (dog.onGround) {
          dog.vy = JUMP_V;
          dog.onGround = false;
          spawnParticles(dog.x + dog.size * 0.3, groundY, 6);
        }
      }

      function spawnParticles(x, y, count) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 0.25,
            vy: -Math.random() * 0.3,
            life: 400 + Math.random() * 300,
            age: 0,
            r: 2 + Math.random() * 3,
            color: `hsl(${Math.random() * 360},80%,65%)`
          });
        }
      }

      function spawnObstacle() {
        const types = ['cone', 'block', 'floater'];
        const type = types[Math.floor(Math.random() * types.length)];
        let w, h, y, label;
        if (type === 'cone') { w = 28; h = 42; y = groundY - h; label = '🚧'; }
        else if (type === 'block') { w = 40; h = 40; y = groundY - h; label = '📦'; }
        else { w = 34; h = 34; y = groundY - DOG_SIZE * 0.85; label = '🎈'; }
        obstacles.push({ x: W + 40, y, w, h, type, label, passed: false });
      }

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function update(dt) {
        elapsed += dt;
        // difficulty ramps
        speed = 0.32 + Math.min(elapsed / 1000, 60) * 0.0035;

        // animate dog dance frames (faster when on ground / running)
        frameTimer += dt;
        const frameInterval = dog.onGround ? 45 : 70;
        if (frameTimer > frameInterval) {
          frameTimer = 0;
          animFrame = (animFrame + 1) % FRAME_COUNT;
        }

        // physics
        dog.vy += GRAVITY * dt;
        dog.y += dog.vy * dt;
        if (dog.y + dog.size >= groundY) {
          dog.y = groundY - dog.size;
          if (!dog.onGround) {
            spawnParticles(dog.x + dog.size * 0.3, groundY, 8);
          }
          dog.vy = 0;
          dog.onGround = true;
        } else {
          dog.onGround = false;
        }

        // squash/stretch feedback
        if (dog.onGround) {
          dog.squash += (1 - dog.squash) * 0.2;
        } else {
          dog.squash += (0.9 - dog.squash) * 0.2;
        }

        // spawn obstacles
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnObstacle();
          spawnTimer = Math.max(650, 1500 - elapsed / 40) + Math.random() * 400;
        }

        // move obstacles
        const dogHitbox = { x: dog.x + 18, y: dog.y + 14, w: dog.size - 36, h: dog.size - 24 };
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const o = obstacles[i];
          o.x -= speed * dt;
          if (!o.passed && o.x + o.w < dog.x) {
            o.passed = true;
            score += 1;
            scoreEl.textContent = score;
          }
          if (rectsOverlap(dogHitbox, o)) {
            endGame();
          }
          if (o.x + o.w < -20) obstacles.splice(i, 1);
        }

        // particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.age += dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 0.0009 * dt;
          if (p.age > p.life) particles.splice(i, 1);
        }
      }

      function endGame() {
        if (gameOver) return;
        gameOver = true;
        running = false;
        if (score > best) {
          best = score;
          localStorage.setItem('discoDogBest', String(best));
        }
        bestEl.textContent = best;
        showOverlay(true);
      }

      function drawBackground() {
        // ground
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ground');
        ctx.fillRect(0, groundY, W, H - groundY);
        ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ground-line');
        ctx.lineWidth = 3;
        const stripeOffset = (elapsed * speed * 0.6) % 40;
        for (let x = -stripeOffset; x < W; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, groundY + 8);
          ctx.lineTo(x + 20, groundY + 8);
          ctx.stroke();
        }
        // sun / disco ball vibe
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(W * 0.85, H * 0.18, 32, 0, Math.PI * 2);
        ctx.fillStyle = '#fff6d0';
        ctx.fill();
        ctx.restore();
      }

      function drawDog() {
        const img = images[animFrame];
        if (!img || !img.complete) return;
        const s = dog.size;
        const squashW = 1 / dog.squash;
        const squashH = dog.squash;
        ctx.save();
        ctx.translate(dog.x + s / 2, dog.y + s);
        ctx.scale(squashW, squashH);
        ctx.drawImage(img, -s / 2, -s, s, s);
        ctx.restore();
      }

      function drawObstacles() {
        ctx.font = '30px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const o of obstacles) {
          ctx.save();
          if (o.type === 'floater') {
            o.bob = (o.bob || 0) + 0.002;
          }
          ctx.font = `${Math.max(o.w, o.h)}px serif`;
          ctx.fillText(o.label, o.x + o.w / 2, o.y + o.h / 2);
          ctx.restore();
        }
      }

      function drawParticles() {
        for (const p of particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function render() {
        ctx.clearRect(0, 0, W, H);
        drawBackground();
        drawObstacles();
        drawDog();
        drawParticles();
      }

      let lastTime = null;
      function loop(t) {
        if (lastTime === null) lastTime = t;
        let dt = t - lastTime;
        lastTime = t;
        if (dt > 50) dt = 50; // clamp for tab-switch lag
        if (running && !gameOver) {
          update(dt);
        } else if (!running && !gameOver) {
          // idle dance animation on start screen
          frameTimer += dt;
          if (frameTimer > 60) {
            frameTimer = 0;
            animFrame = (animFrame + 1) % FRAME_COUNT;
          }
        }
        render();
        requestAnimationFrame(loop);
      }

      function showOverlay(isGameOver) {
        overlay.classList.remove('hidden');
        const h1 = overlay.querySelector('h1');
        const ps = overlay.querySelectorAll('p');
        if (isGameOver) {
          h1.textContent = 'BUSTED!';
          ps[0].textContent = `Score: ${score}  •  Best: ${best}`;
          ps[1].textContent = 'The dance floor got the best of you.';
          startBtn.textContent = 'Dance Again';
        } else {
          h1.textContent = 'DISCO DOG DASH';
          ps[0].textContent = 'Tap / Click / Press Space to jump.';
          ps[1].textContent = 'Dodge the obstacles and keep the dance going!';
          startBtn.textContent = 'Start Dancing';
        }
      }

      function hideOverlay() {
        overlay.classList.add('hidden');
      }

      function startGame() {
        resetGame();
        running = true;
        hideOverlay();
      }

      startBtn.addEventListener('click', startGame);

      function handleInput(e) {
        if (e.type === 'keydown' && e.code !== 'Space') return;
        if (e.type === 'keydown') e.preventDefault();
        if (!running && !gameOver) {
          // start screen: ignore, must press button (mobile-friendly)
          return;
        }
        if (gameOver) return;
        jump();
      }

      window.addEventListener('keydown', handleInput);
      wrap.addEventListener('mousedown', (e) => { if (running) jump(); });
      wrap.addEventListener('touchstart', (e) => { if (running) { e.preventDefault(); jump(); } }, { passive: false });

      // init idle state
      groundY = H * 0.82;
      dog = { x: W * 0.18, y: groundY - DOG_SIZE, vy: 0, onGround: true, size: DOG_SIZE, squash: 1 };
      obstacles = []; particles = [];
      frameTimer = 0; animFrame = 0; elapsed = 0;
      requestAnimationFrame(loop);
    })();
  </script>
</body>

</html>
